services:

  api:
    build: .
    container_name: beardbarbarus_api
    ports:
      - "8000:8000"
    depends_on:
      - postgres
    networks:
      - network-beardbarbarus

  postgres:
    image: postgres:15
    container_name: barbarus_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - network-beardbarbarus

  pgadmin:
    image: dpage/pgadmin4
    container_name: beardbarbarus_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - network-beardbarbarus

volumes:
  postgres_data:

networks:
  network-beardbarbarus:
    driver: bridge